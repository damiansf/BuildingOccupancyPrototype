plugins {
    id "checkstyle"
    id "application"
}
apply plugin: "java"
apply plugin: "jacoco"

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

jacoco {
    toolVersion = "0.8.5"
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation("junit:junit:4.13")
}

checkstyle {
    toolVersion = "8.26"
}

application {
    mainClass = "buildingoccupationanalyzer.MainApplication"
}

run{
    standardInput = System.in
}

jar {
   manifest {
      attributes("Main-Class": "buildingoccupationanalyzer.MainApplication")
   }
   archiveBaseName = "buildingOccupationAnalyzer"
}

task lint(dependsOn: [checkstyleMain, checkstyleTest])

test {
    useJUnit()
    testLogging {
        showStandardStreams = true
    }
}

test.finalizedBy jacocoTestReport